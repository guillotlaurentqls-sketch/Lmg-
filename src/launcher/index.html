<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdBlock Launcher</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body class="mode-home">
  <header id="bar" hidden>
    <button id="btnBack" title="Précédent (Alt+←)">←</button>
    <button id="btnFwd" title="Suivant (Alt+→)">→</button>
    <button id="btnReload" title="Actualiser (Ctrl+R)">↻</button>
    <button id="btnHome" title="Accueil (Ctrl+H)">⌂</button>
    <input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="Coller une adresse puis Entrée">
    <div class="group">
      <button id="btnZoomOut" title="Zoom − (Ctrl+-)">−</button>
      <button id="btnZoomReset" class="zoom" title="Zoom 100 % (Ctrl+0)">100 %</button>
      <button id="btnZoomIn" title="Zoom + (Ctrl++)">+</button>
    </div>
    <button id="btnBlock" class="shield" title="Activer / désactiver le blocage sur ce site">
      <span id="shieldLabel">Blocage</span> <b id="blockedCount">0</b>
    </button>
    <button id="btnPin" title="Épingler ce site en favori">☆</button>
    <span id="drmChip" class="chip" hidden title=""></span>
  </header>

  <main id="home">
    <header class="top">
      <span class="logo">AdBlock Launcher</span>
      <form id="homeForm">
        <input id="homeInput" type="text" spellcheck="false" autocomplete="off" autofocus
               placeholder="Coller l’adresse d’un site puis Entrée (avec ou sans https://)">
      </form>
    </header>
    <p id="homeError" class="error" role="alert" hidden></p>

    <section id="hero" class="hero" hidden>
      <div class="hero-body">
        <p class="eyebrow">Reprendre</p>
        <h1 id="heroTitle"></h1>
        <p id="heroSub" class="hero-sub"></p>
        <div class="hero-actions">
          <button id="heroPlay" class="primary">▶ Reprendre</button>
          <button id="heroHome">Page d’accueil du site</button>
        </div>
      </div>
    </section>

    <p id="empty" class="empty" hidden>Ta bibliothèque est vide. Colle l’adresse d’un site ci-dessus : il sera ajouté ici automatiquement, puis tu pourras le classer dans un groupe.</p>
    <div id="rows"></div>

    <footer>
      <div id="drmBanner" class="banner" hidden></div>
      <span id="filterStatus"></span>
      <button id="btnFilters" class="link">Mettre à jour les filtres</button>
      <span id="totalBlocked"></span>
    </footer>

    <dialog id="dlg">
      <form id="dlgForm" method="dialog">
        <h3>Modifier le site</h3>
        <label>Nom <input id="dlgTitle" type="text" maxlength="60" autocomplete="off"></label>
        <label>Groupe <input id="dlgGroup" type="text" maxlength="40" list="groupList" autocomplete="off" placeholder="ex. Séries, Sport, Documentaires"></label>
        <datalist id="groupList"></datalist>
        <label class="check"><input id="dlgFav" type="checkbox"> Favori</label>
        <p id="dlgUrl" class="hint"></p>
        <div class="dlg-actions">
          <button type="button" id="dlgRemove" class="danger">Retirer de la bibliothèque</button>
          <span class="spacer"></span>
          <button type="button" id="dlgCancel">Annuler</button>
          <button type="submit" class="primary">Enregistrer</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
